# River Watch - Pi-local Nginx config (inside the frontend container)
# Serves static React build, proxies /api -> backend, upgrades /api/ws -> WebSocket.

upstream riverwatch_backend {
    server backend:8001;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 25m;

    # WebSocket upgrade for raw AIS stream (must be BEFORE the /api/ block).
    location /api/ws/ {
        proxy_pass http://riverwatch_backend/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # Backend HTTP API
    location /api/ {
        proxy_pass http://riverwatch_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # FastAPI auto-docs (handy for diagnostics)
    location /docs {
        proxy_pass http://riverwatch_backend/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://riverwatch_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # Static React build (SPA fallback)
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
