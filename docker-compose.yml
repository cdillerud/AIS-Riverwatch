version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: riverwatch-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riverwatch-backend
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=riverwatch
      - CORS_ORIGINS=*
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # For local development, use localhost:8001
        # For production, change this to your actual domain
        - REACT_APP_BACKEND_URL=http://localhost:8001
    container_name: riverwatch-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
