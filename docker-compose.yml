version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: riverwatch-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riverwatch-backend
    network_mode: host
    environment:
      - MONGO_URL=mongodb://localhost:27017
      - DB_NAME=riverwatch
      - CORS_ORIGINS=*
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=https://riverwatchais.com
    container_name: riverwatch-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
