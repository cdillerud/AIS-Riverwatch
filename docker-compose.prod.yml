# River Watch - production stack: nginx (TLS) serves the static frontend and
# proxies /api + /ws to the backend on the same origin, so no CORS is needed.
#
#   cp backend/.env.example .env      # set AIS_INGEST_TOKEN etc.
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Certificates go in ./nginx/ssl (see nginx/nginx.conf).

services:
  mongodb:
    image: mongo:7
    container_name: riverwatch-mongo
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - riverwatch-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riverwatch-backend
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=riverwatch
      # Same-origin behind nginx: only list origins if a separate frontend host is used.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Relays must send this in X-Ingest-Token. Strongly recommended in production.
      - AIS_INGEST_TOKEN=${AIS_INGEST_TOKEN:-}
      # Hosted server: never dial private/LAN addresses on users' behalf.
      - AIS_ALLOW_PRIVATE_TARGETS=${AIS_ALLOW_PRIVATE_TARGETS:-false}
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - riverwatch-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Empty = same origin (recommended behind nginx).
        - REACT_APP_BACKEND_URL=${BACKEND_URL:-}
    container_name: riverwatch-frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - riverwatch-net

  nginx:
    image: nginx:alpine
    container_name: riverwatch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - riverwatch-net

volumes:
  mongodb_data:

networks:
  riverwatch-net:
    driver: bridge
