# River Watch - production stack. Caddy (HTTPS, automatic certificates)
# serves the frontend and proxies /api + /ws to the backend on the same
# origin, so no CORS is needed. Step-by-step: DEPLOY_HOSTED.md.
#
#   cp deploy/production.env.example .env      # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  mongodb:
    image: mongo:7
    container_name: riverwatch-mongo
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - riverwatch-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riverwatch-backend
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=riverwatch
      # Same-origin behind nginx: only list origins if a separate frontend host is used.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Relays must send this in X-Ingest-Token. Strongly recommended in production.
      - AIS_INGEST_TOKEN=${AIS_INGEST_TOKEN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-}
      # Hosted server: never dial private/LAN addresses on users' behalf.
      - AIS_ALLOW_PRIVATE_TARGETS=${AIS_ALLOW_PRIVATE_TARGETS:-false}
      # Optional second live AIS source (https://aisstream.io); empty = off.
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      # Session cookies only over HTTPS (nginx terminates TLS).
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # Demo boats: off unless an admin enables them ("on" for a sales demo instance).
      - RIVERWATCH_DEMO_VESSELS_MODE=${RIVERWATCH_DEMO_VESSELS_MODE:-auto}
      # Email (daily reports, feed-outage alerts); empty REPORT_SMTP_HOST = off.
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
      - REPORT_SMTP_HOST=${REPORT_SMTP_HOST:-}
      - REPORT_SMTP_PORT=${REPORT_SMTP_PORT:-465}
      - REPORT_SMTP_USER=${REPORT_SMTP_USER:-}
      - REPORT_SMTP_PASSWORD=${REPORT_SMTP_PASSWORD:-}
      - REPORT_EMAIL_FROM=${REPORT_EMAIL_FROM:-}
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - riverwatch-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Empty = same origin (recommended behind nginx).
        - REACT_APP_BACKEND_URL=${BACKEND_URL:-}
    container_name: riverwatch-frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - riverwatch-net

  # Public entry point: HTTPS with automatic Let's Encrypt certificates and
  # renewal (deploy/Caddyfile). Needs RIVERWATCH_DOMAIN in .env and the
  # domain's DNS A record pointing at this server.
  caddy:
    image: caddy:2.8.4-alpine
    container_name: riverwatch-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - RIVERWATCH_DOMAIN=${RIVERWATCH_DOMAIN:?set RIVERWATCH_DOMAIN in .env}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - riverwatch-net

  # Nightly compressed database backup to ./backups, keeping 14 days.
  # Restore: docker compose -f docker-compose.prod.yml exec -T mongodb   #   mongorestore --archive --gzip --drop < backups/riverwatch-YYYY-MM-DD.archive.gz
  mongo-backup:
    image: mongo:7
    container_name: riverwatch-mongo-backup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/riverwatch-$$(date -u +%F).archive.gz
          mongodump --uri=mongodb://mongodb:27017/riverwatch --archive --gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup ok: $$f"
          find /backups -name 'riverwatch-*.archive.gz' -mtime +14 -delete
          sleep 86400
        done
    volumes:
      - ./backups:/backups
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - riverwatch-net

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:

networks:
  riverwatch-net:
    driver: bridge
